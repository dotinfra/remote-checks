name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

      - name: Build static binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o remote-checks ./cmd/server

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-checks-${{ github.sha }}
          path: remote-checks
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: remote-checks:ci
          load: true

      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 8080:8080 remote-checks:ci
          for i in $(seq 1 10); do
            curl -sf http://localhost:8080/ -o /dev/null && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = "302"
          curl -s 'http://localhost:8080/checks?url=http://localhost:8080/' | grep -q '"response_code":"302"'
          docker rm -f smoke
