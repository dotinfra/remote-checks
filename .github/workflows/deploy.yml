name: Deploy to Scaleway

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point Scaleway container at new image
        run: |
          curl -sf -X PATCH \
            -H "X-Auth-Token: ${{ secrets.SCW_SECRET_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"registry_image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}", "port": 8080, "health_check": {"http": {"path": "/healthz"}}}' \
            "https://api.scaleway.com/containers/v1/regions/${{ vars.SCW_REGION || 'fr-par' }}/containers/${{ secrets.SCW_CONTAINER_ID }}"

      - name: Deploy container
        run: |
          curl -sf -X POST \
            -H "X-Auth-Token: ${{ secrets.SCW_SECRET_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.scaleway.com/containers/v1/regions/${{ vars.SCW_REGION || 'fr-par' }}/containers/${{ secrets.SCW_CONTAINER_ID }}/deploy"

      - name: Wait for deployment and smoke test
        run: |
          for i in $(seq 1 30); do
            status=$(curl -sf \
              -H "X-Auth-Token: ${{ secrets.SCW_SECRET_KEY }}" \
              "https://api.scaleway.com/containers/v1/regions/${{ vars.SCW_REGION || 'fr-par' }}/containers/${{ secrets.SCW_CONTAINER_ID }}" \
              | jq -r .status)
            if [ "$status" = "ready" ] || [ "$status" = "running" ]; then
              echo "Container status: $status"
              break
            fi
            if [ "$status" = "error" ] || [ "$status" = "crashed" ]; then
              echo "Deployment failed, container status: $status"
              exit 1
            fi
            sleep 10
          done
          domain=$(curl -sf \
            -H "X-Auth-Token: ${{ secrets.SCW_SECRET_KEY }}" \
            "https://api.scaleway.com/containers/v1/regions/${{ vars.SCW_REGION || 'fr-par' }}/containers/${{ secrets.SCW_CONTAINER_ID }}" \
            | jq -r .domain_name)
          echo "Testing https://$domain/healthz"
          for i in $(seq 1 10); do
            if curl -sf "https://$domain/healthz"; then exit 0; fi
            sleep 6
          done
          echo "Smoke test failed"
          exit 1
